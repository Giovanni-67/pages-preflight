name: Test Pages Preflight
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test the checker
        run: python -m unittest discover -s tests -v
      - name: Accept the valid artifact
        uses: ./
        with:
          directory: examples/fixed
          base-path: /demo/
      - name: Reject the broken artifact
        id: broken
        continue-on-error: true
        uses: ./
        with:
          directory: examples/broken
          base-path: /demo/
      - name: Require the broken artifact to fail
        if: steps.broken.outcome != 'failure'
        shell: bash
        run: exit 1
